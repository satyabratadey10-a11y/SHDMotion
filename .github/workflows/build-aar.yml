name: Build MotionEngine AAR

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;25.2.9519653"
      - name: Install Android NDK
        run: |
          test -d "$ANDROID_HOME/ndk/25.2.9519653"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7
      - name: Build release AAR
        run: |
          ./gradlew :motion-engine:assembleRelease
          ./gradlew :demo:assembleDebug --refresh-dependencies
      - uses: actions/upload-artifact@v4
        with:
          name: motion-engine-aar-and-demo-apk
          path: |
            motion-engine/build/outputs/aar/*.aar
            demo/build/outputs/apk/debug/*.apk
